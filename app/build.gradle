plugins {
    id "com.android.application"
}

android {
    namespace "com.nielk74.colorospowerlauncher"
    compileSdk 36

    defaultConfig {
        applicationId "com.nielk74.colorospowerlauncher"
        minSdk 31
        targetSdk 36
        versionCode 10
        versionName "1.1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
    }
}
